<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Maze Input</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
    }

    table {
      border-collapse: collapse;     /* connected grid lines */
      margin: 20px auto;
    }

    td {
      border: 1px solid #000;        /* visible grid */
      width: 35px;
      height: 35px;
      text-align: center;
      padding: 0;
    }

    input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 16px;
      text-transform: uppercase;
    }

    /* Color classes for solver output */
    .wall   { background: black;  color: white; }
    .start  { background: red;    color: white; }
    .finish { background: red;    color: white; }
    .path   { background: limegreen; color: white; }

    button {
      margin: 10px 5px;
      padding: 8px 14px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h2>Maze Input</h2>
  <p>Enter W for wall, S for start, F for finish, leave blank for path.</p>

  <table id="maze"></table>
  <button onclick="solve()">Solve</button>
  <button onclick="resetMaze()">Reset</button>

  <script>
    const rows = 10, cols = 10;
    let maze = [];

    function createGrid() {
      const table = document.getElementById("maze");
      table.innerHTML = "";
      maze = [];

      for (let r = 0; r < rows; r++) {
        const tr = document.createElement("tr");
        maze[r] = [];
        for (let c = 0; c < cols; c++) {
          const td = document.createElement("td");
          const input = document.createElement("input");
          input.type = "text";
          input.maxLength = 1;
          input.size = 1;

          input.oninput = () => {
            maze[r][c] = input.value.toUpperCase() || '.';
          };

          td.appendChild(input);
          tr.appendChild(td);
          maze[r][c] = '.';
        }
        table.appendChild(tr);
      }
    }

    //solver goes here


    function solve() {
      console.clear();
      console.table(maze);
      alert("Maze printed in console");
    }

    // reset button
    function resetMaze() {
      createGrid();
    }



    function colourSolvedMaze(solved) {
      const table = document.getElementById("maze");

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const td = table.rows[r].cells[c];
          const input = td.querySelector("input");
          const val = solved[r][c].toUpperCase();

          td.className = ""; // remove previous colors

          if (val === "W") td.classList.add("wall");
          else if (val === "S") td.classList.add("start");
          else if (val === "F") td.classList.add("finish");
          else if (val === "P") td.classList.add("path");

         
          input.value = (val === "W" || val === "S" || val === "F") ? val : "";
        }
      }
    }

    createGrid();
  </script>
</body>
</html>
